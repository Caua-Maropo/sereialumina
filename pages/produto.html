<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Produto | Sereia Lumina</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Moda praia feminina Sereia Lumina">

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<header class="site-header clean-header">
  <a href="../index.html">← Voltar</a>
</header>

<main class="produto-page">

  <section class="produto-wrapper">

    <!-- ESQUERDA: galeria de imagens -->
    <div class="produto-gallery">
      <div class="produto-main-image">
        <img id="produto-imagem" src="" alt="">
      </div>
      <div class="produto-thumbs">
        <!-- miniaturas serão geradas aqui -->
      </div>
    </div>

    <!-- DIREITA: detalhes do produto -->
    <div class="produto-details">

      <h1 id="produto-nome"></h1>

      <p class="produto-preco">
        R$ <span id="produto-preco"></span>
      </p>

      <p id="produto-descricao" class="produto-descricao"></p>

      <!-- CORES -->
      <div class="produto-selecao">
        <p>Cor:</p>
        <div id="produto-cores" class="produto-cores"></div>
      </div>

      <!-- TAMANHOS -->
      <div class="produto-selecao">
        <p>Tamanho:</p>
        <div id="produto-tamanhos" class="produto-tamanhos"></div>
        <p id="estoque-info" class="estoque-info"></p>
      </div>

      <button class="btn-principal btn-add-carrinho">
        <i class="fa-solid fa-bag-shopping"></i>
        Adicionar ao carrinho
      </button>

      <div class="produto-beneficios">
        <p>✔ Envio rápido</p>
        <p>✔ Entrega segura</p>
      </div>

    </div>

  </section>

</main>



<script src="../assets/js/produtos.js"></script>
<script src="../assets/js/produto.js"></script>
<script src="../assets/js/script.js"></script>
<script src="../assets/js/favoritos.js"></script>

</body>
</html>
