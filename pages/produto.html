<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Produto | Sereia Lumina</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">

  <!-- FONTES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

  <!-- ICONES -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header class="site-header clean-header">
  <div class="header-container">

    <!-- Logo -->
    <a href="index.html" class="logo">
      <span class="use">Use</span>
      <h1>Sereia Lumina</h1>
    </a>

    <!-- Busca -->
    <div class="search-area">
      <input type="text" placeholder="Pesquisar produtos">
      <button>🔍</button>
    </div>

    <!-- Ícones -->
    <div class="header-icons">

      <a href="login.html" title="Login">
        <i class="fa-regular fa-user"></i>
      </a>

    <button 
  id="btn-favorito-produto"
  data-id="biquini-amarelo"
  class="btn-favorito"
>
  <i class="fa-regular fa-heart"></i>
</button>

      <a href="#" id="abrir-carrinho" class="icon-bag" title="Carrinho">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="badge-carrinho" id="badge-carrinho">0</span>
      </a>

    </div>
  </div>
</header>

<!-- ÁREA DO PRODUTO -->
<main class="pagina-produto">
  <section class="produto-container">
    
    <div class="produto-imagem">
      <img id="produto-imagem" alt="Imagem do produto">
    </div>

    <div class="produto-info">
      <h1 id="produto-nome"></h1>
      <p id="produto-preco"></p>
      <p id="produto-descricao"></p>

      <div class="produto-opcoes">
        <div id="produto-cores"></div>
        <div id="produto-tamanhos"></div>
        <p id="estoque-info"></p>
      </div>

      <button id="btn-add-produto">Adicionar ao carrinho</button>
      <button id="btn-favorito">♡ Favoritar</button>
    </div>

  </section>
</main>


<!-- RELACIONADOS -->
<section class="produtos-relacionados">
  <h2>Você também pode gostar</h2>
  <div id="lista-relacionados" class="produtos-grid"></div>
</section>

<!-- OVERLAY -->
<div id="overlay-carrinho"></div>

<!-- CARRINHO LATERAL -->
<aside id="carrinho-lateral">
  <header class="carrinho-header">
    <h3>Meu Carrinho</h3>
    <button id="fechar-carrinho">✕</button>
  </header>

  <ul id="lista-carrinho"></ul>

  <div class="carrinho-footer">
    <div class="carrinho-total">
      <span>Total</span>
      <strong>R$ <span id="total-carrinho">0,00</span></strong>
    </div>

    <button id="finalizar-whatsapp">
      Finalizar no WhatsApp
    </button>
  </div>
</aside>

<!-- SCRIPTS -->
<script src="../assets/js/produtos.js"></script>
<script src="../assets/js/produto.js"></script>
<script type="../assets/js/module" src="auth.js"></script>
<script>
  protegerPagina();
</script>
  
</script>
</body>
</html>
