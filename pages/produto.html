<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Produto | Sereia Lumina</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Moda praia feminina Sereia Lumina">

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<header class="site-header clean-header">
  <div class="header-container">

    <a href="../index.html" class="logo" aria-label="Página inicial Sereia Lumina">
      <span class="use">Use</span>
      <span class="brand-name">Sereia Lumina</span>
    </a>

    <div class="search-area">
      <input type="text" placeholder="Pesquisar produtos" aria-label="Pesquisar produtos">
      <button type="button" aria-label="Buscar">🔍</button>
    </div>

    <div class="header-icons">
      <a href="login.html" aria-label="Minha conta">
        <i class="fa-regular fa-user"></i>
      </a>

      <a href="favoritos.html" class="icon-heart" aria-label="Favoritos">
        <i class="fa-regular fa-heart"></i>
        <span id="badge-favoritos" class="badge">0</span>
      </a>

      <a href="#" id="abrir-carrinho" class="icon-bag" title="Carrinho" aria-label="Carrinho">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="badge-carrinho" id="badge-carrinho">0</span>
      </a>
    </div>

  </div>
</header>

<main class="produto-page">

  <section class="produto-wrapper">

    <!-- ESQUERDA: galeria de imagens -->
    <div class="produto-gallery">
      <div class="produto-main-image">
        <img id="produto-imagem" src="" alt="">
      </div>
      <div class="produto-thumbs">
        <!-- miniaturas serão geradas aqui -->
      </div>
    </div>

    <!-- DIREITA: detalhes do produto -->
    <div class="produto-details">

      <h1 id="produto-nome"></h1>

      <p class="produto-preco">
        R$ <span id="produto-preco"></span>
      </p>

      <p id="produto-descricao" class="produto-descricao"></p>

    
      <!-- TAMANHOS -->
   <div class="tamanhos-area">
  <p class="titulo-tamanho">Tamanhos</p>

  <div id="lista-tamanhos" class="lista-tamanhos">
    <!-- JS vai inserir os botões aqui -->
  </div>

  <p id="aviso-tamanho" class="aviso-tamanho">
    Selecione um tamanho
  </p>
</div>

      <button class="btn-carrinho" disabled>
        <i class="fa-solid fa-bag-shopping"></i>
        Adicionar ao carrinho
      </button>

      <div class="produto-beneficios">
        <p>✔ Envio rápido</p>
        <p>✔ Entrega segura</p>
      </div>

    </div>

  </section>

</main>

<div id="overlay-carrinho"></div>

<aside id="carrinho-lateral">
  <header>
    <h3>Meu carrinho</h3>
    <button id="fechar-carrinho">✕</button>
  </header>

  <ul id="lista-carrinho"></ul>

  <div class="carrinho-footer">
    <p>Total: R$ <span id="total-carrinho">0,00</span></p>
    <button id="finalizar-whatsapp">Finalizar no WhatsApp</button>
  </div>
</aside>


<script src="../assets/js/produtos.js"></script>
<script src="../assets/js/produto.js"></script>
<script src="../assets/js/script.js"></script>
<script src="../assets/js/favoritos.js"></script>

</body>
</html>
