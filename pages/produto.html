<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Produto | Sereia Lumina</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Moda praia feminina Sereia Lumina">

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<header class="site-header clean-header">
  <a href="../index.html">← Voltar</a>
</header>

<main class="produto-page">

  <section class="produto-container">
    <img id="produto-imagem" alt="Imagem do produto">

    <div class="produto-info">
      <h1 id="produto-nome"></h1>
      <p id="produto-preco"></p>
      <p id="produto-descricao"></p>
      <p><strong>Peso:</strong> <span id="produto-peso"></span></p>

      <div>
        <h4>Cores</h4>
        <div id="produto-cores" class="cores"></div>
      </div>

      <div>
        <h4>Tamanhos</h4>
        <div id="produto-tamanhos" class="tamanhos"></div>
        <p id="estoque-info"></p>
      </div>

      <button id="btn-add-produto">Adicionar ao carrinho</button>
      <button id="btn-favorito">❤ Favoritar</button>
    </div>
  </section>

</main>

<script src="../assets/js/produtos.js"></script>
<script src="../assets/js/produto.js"></script>
<script src="../assets/js/script.js"></script>
<script src="../assets/js/favoritos.js"></script>

</body>
</html>
