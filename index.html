<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sereia Lumina</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="assets/css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>

<body>

<header class="site-header clean-header">
  <div class="header-container">

    <a href="index.html" class="logo">
      <span class="use">Use</span>
      <h1>Sereia Lumina</h1>
    </a>

    <div class="search-area">
      <input type="text" placeholder="Pesquisar produtos">
      <button type="button">🔍</button>
    </div>

    <div class="header-icons">
      <a href="pages/login.html"><i class="fa-regular fa-user"></i></a>

      <a href="pages/favoritos.html" class="icon-heart">
        <i class="fa-regular fa-heart"></i>
        <span id="badge-favoritos" class="badge">0</span>
      </a>

      <a href="#" id="abrir-carrinho" class="icon-bag" title="Carrinho">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="badge-carrinho" id="badge-carrinho">0</span>
      </a>

      <div class="user-area" id="user-area" style="display:none;">
        <span id="user-email"></span>
        <button type="button" id="logout-btn">Sair</button>
      </div>
    </div>

  </div>
</header>

<!-- CONTEÚDO PRINCIPAL -->
<main>

  <section class="hero">
  <div class="hero-images">
    <img src="assets/imagens/biquini-amarelo.png" alt="">
    <img src="assets/imagens/biquini-preto.png" alt="">
    <img src="assets/imagens/biquini-brasil.png" alt="">
  </div>

  <div class="hero-text">
    <p class="season">Moda Verão 2026</p>
    <h2>Coleções em Destaque</h2>
    <a href="#produtos" class="btn-hero">Ver Produtos</a>
  </div>
</section>


  <section class="categorias">
    <div class="cat-card" data-category="biquini">Biquínis</div>
    <div class="cat-card" data-category="maio">Maiôs</div>
    <div class="cat-card" data-category="saida">Saídas de Praia</div>
    <div class="cat-card" data-category="todos">Todos</div>
  </section>

  <section id="lista-produtos" class="grid-produtos">
    <!-- gerar card automaticamente -->
  </section>
   
</main>

<footer class="site-footer">
  <p>© 2025 • Sereia Lumina</p>
  <p>Contato: WhatsApp (81) 9 8295-9208</p>
</footer>

<div id="overlay-carrinho"></div>

<aside id="carrinho-lateral">
  <header class="carrinho-header">
    <h3>Meu Carrinho</h3>
    <button type="button" id="fechar-carrinho">✕</button>
  </header>

  <ul id="lista-carrinho"></ul>

  <div class="carrinho-footer">
    <span>Total: R$ <strong id="total-carrinho">0,00</strong></span>
    <button type="button" id="finalizar-whatsapp">Finalizar no WhatsApp</button>
  </div>
</aside>

<script src="assets/js/produto.js"></script>
<script src="assets/js/render-produtos.js"></script>
<scrip src="assets/js/script.js"></scrip> 
<script src="assets/js/favoritos.js"></script>

</body>
</html>
